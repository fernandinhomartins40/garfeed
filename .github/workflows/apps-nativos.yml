name: Apps nativos (Android + iOS)

# Compila o app do PAINEL para as duas lojas nas máquinas do GitHub (não precisa de Mac).
# Só roda à mão: Actions > "Apps nativos" > Run workflow. Passo a passo e segredos: docs/apps-nativos/COMPILAR-SEM-MAC.md
# Sem os segredos de assinatura cada job ainda compila (sem assinar) só para validar o projeto, com aviso.

"on":
  workflow_dispatch:
    inputs:
      plataforma:
        description: Qual app compilar
        type: choice
        options: [ambos, android, ios]
        default: ambos
      versao:
        description: "Versão visível nas lojas (ex.: 1.0.0)"
        default: "1.0.0"

permissions:
  contents: read

# Um build por vez, sem cancelar o que está em andamento (cada execução gasta um número de build).
concurrency:
  group: apps-nativos
  cancel-in-progress: false

env:
  APP_VERSION: ${{ inputs.versao }}
  # versionCode (Android) / CFBundleVersion (iOS): sempre crescente, exigência das lojas
  APP_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: Android (AAB da Play Store)
    if: inputs.plataforma == 'ambos' || inputs.plataforma == 'android'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restaurar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Segredo ANDROID_KEYSTORE_BASE64 ausente: o AAB sai SEM assinatura (serve só para validar o build; a Play Store não aceita)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Gerar o AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: garfeed-painel-${{ env.APP_VERSION }}-${{ env.APP_BUILD_NUMBER }}-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Apagar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  ios:
    name: iOS (TestFlight)
    if: inputs.plataforma == 'ambos' || inputs.plataforma == 'ios'
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    env:
      KEYCHAIN: ${{ runner.temp }}/garfeed-build.keychain-db
      ARCHIVE: ${{ runner.temp }}/Garfeed.xcarchive
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependências e sincronizar o projeto iOS
        run: |
          npm ci
          npx cap sync ios

      - name: Preparar assinatura (keychain temporário, certificado e perfil)
        id: assinatura
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for s in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROFILE_BASE64 ASC_API_KEY_P8 ASC_API_KEY_ID ASC_API_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!s}" ]; then
              echo "::warning::Segredo $s ausente: o iOS será compilado SEM assinatura, só para validar o projeto (nada vai ao TestFlight)."
              echo "assinar=nao" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # keychain só deste build, com senha aleatória
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"

          # perfil de provisionamento: instala com o UUID no nome (as duas pastas que o Xcode consulta)
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" > "$RUNNER_TEMP/perfil.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/perfil.plist")"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/perfil.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done

          # chave da API do App Store Connect (aceita o conteúdo do .p8 ou ele em base64)
          if printf '%s' "$ASC_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_$ASC_API_KEY_ID.p8"
          else
            printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_API_KEY_ID.p8"
          fi

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "assinar=sim" >> "$GITHUB_OUTPUT"

      - name: Compilar sem assinatura (validação do projeto)
        if: steps.assinatura.outputs.assinar != 'sim'
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      # GF_* são lidos só pelo alvo App (project.pbxproj, configuração Release: CODE_SIGN_STYLE = Manual).
      # Passar CODE_SIGN_IDENTITY/PROVISIONING_PROFILE_SPECIFIER direto aqui valeria também para os pacotes SPM, que não aceitam perfil.
      - name: Arquivar (assinatura manual, Apple Distribution)
        if: steps.assinatura.outputs.assinar == 'sim'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            GF_SIGN_IDENTITY="Apple Distribution" GF_TEAM_ID="$APPLE_TEAM_ID" GF_PROFILE="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Exportar e enviar ao App Store Connect (TestFlight)
        if: steps.assinatura.outputs.assinar == 'sim'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>br.com.garfeed.painel</key><string>$PROFILE_UUID</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_API_KEY_ID.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          echo "Build $APP_VERSION ($APP_BUILD_NUMBER) enviado. Aparece no TestFlight depois do processamento da Apple (5 a 30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar chaves e keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/perfil.mobileprovision "$RUNNER_TEMP"/perfil.plist "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/ExportOptions.plist
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
