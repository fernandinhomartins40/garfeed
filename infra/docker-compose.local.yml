# Teste local do compose de produção, SEM SSL, em http://*.garfeed.localhost:8080 (Chrome resolve *.localhost sozinho).
# Na raiz:
#   docker compose --env-file infra/local.env -f infra/docker-compose.yml -f infra/docker-compose.local.yml up -d --build
#   curl -H "Host: api.garfeed.localhost" http://127.0.0.1:8080/health
services:
  nginx:
    ports: !override ["8080:80"]
    volumes:
      - ./nginx/conf.d-local:/etc/nginx/templates:ro
  certbot:
    profiles: [ssl] # sem certificado no teste local
