# g.garfeed.com.br/:codigo — PWA do cliente. Toda rota que não é arquivo cai no index.html (o app lê o código do path).
root /srv/cardapio;
location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; }
location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ { add_header Cache-Control "no-cache"; }
location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
