# painel.garfeed.com.br — SPA do restaurante/admin
root /srv/painel;
# Digital Asset Links do app Android (TWA): arquivo montado de infra/twa/assetlinks.json
location = /.well-known/assetlinks.json { default_type application/json; alias /srv/well-known/assetlinks.json; }
location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
location ~ ^/(sw\.js|manifest\.webmanifest)$ { add_header Cache-Control "no-cache"; }
location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
