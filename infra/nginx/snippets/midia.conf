# midia.garfeed.com.br — MinIO por trás do nginx com cache (MEDIA_PUBLIC_URL = https://midia.garfeed.com.br/garfeed-media).
# GET/HEAD: leitura anônima do bucket, com cache. PUT: upload do painel com URL pré-assinada — o Host repassado
# tem de ser o mesmo que a API usou para assinar (por isso $http_host).
client_max_body_size 110m; # vídeo até 100 MB (MEDIA_LIMITS)
location / {
  limit_except GET HEAD PUT OPTIONS { deny all; }
  set $minio http://minio:9000;
  proxy_pass $minio;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Connection "";
  proxy_request_buffering off;
  proxy_cache midia;
  proxy_cache_key $uri;
  proxy_cache_valid 200 30d;
  proxy_cache_valid 403 404 1m;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating;
  add_header X-Cache $upstream_cache_status;
}
