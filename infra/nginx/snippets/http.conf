# Nível http (incluído pelo template do conf.d).
server_tokens off;
charset utf-8;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Atrás de outro proxy (nginx do host na VPS compartilhada) o esquema real vem em X-Forwarded-Proto
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

# DNS do Docker com validade curta: api/minio recriados trocam de IP sem precisar reiniciar o nginx
resolver 127.0.0.11 valid=10s ipv6=off;

# Cache de mídia (midia.*): arquivos têm nome único por upload, então podem ficar muito tempo.
proxy_cache_path /var/cache/nginx/midia levels=1:2 keys_zone=midia:20m max_size=5g inactive=30d use_temp_path=off;

# Healthcheck do container e descarte de Host desconhecido
server {
  listen 80 default_server;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 444; }
}
