# Garfeed — proxy do nginx do HOST para o nginx do Garfeed (container, 127.0.0.1:3140).
# Instalado em /etc/nginx/sites-available/garfeed. Certificado: certbot do host (webroot /var/www/html).
server {
    listen 80;
    listen [::]:80;
    server_name garfeed.com.br www.garfeed.com.br g.garfeed.com.br painel.garfeed.com.br api.garfeed.com.br midia.garfeed.com.br;

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name garfeed.com.br www.garfeed.com.br g.garfeed.com.br painel.garfeed.com.br api.garfeed.com.br midia.garfeed.com.br;

    ssl_certificate     /etc/letsencrypt/live/garfeed.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garfeed.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 110m;   # vídeo de até 100 MB enviado direto para midia.*
    proxy_request_buffering off;

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }

    location / {
        proxy_pass http://127.0.0.1:3140;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # Socket.io
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
