<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garfeed — sem conexão</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #142433; color: #fff; font: 17px/1.5 -apple-system, system-ui, sans-serif; text-align: center; }
  main { padding: 24px; max-width: 420px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #c9d0d8; }
  button { border: 0; border-radius: 999px; background: #FE581D; color: #fff; font: inherit; font-weight: 700; padding: 14px 28px; }
</style>
</head>
<body>
<main>
  <h1>Sem conexão</h1>
  <p>Não foi possível abrir o painel. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button type="button" onclick="abrir()">Tentar de novo</button>
</main>
<script>
  function abrir() { location.replace('https://painel.garfeed.com.br/ao-vivo'); }
  addEventListener('online', abrir);
</script>
</body>
</html>
