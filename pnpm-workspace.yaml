packages:
  - apps/*
  - packages/*
  - '!apps/mobile' # casca iOS (Capacitor): npm e lockfile próprios, fora do workspace

# pnpm 10 bloqueia scripts de instalação por padrão; liberar só os necessários.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - argon2
  - esbuild
